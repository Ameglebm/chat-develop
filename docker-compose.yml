services:
  app:
    build: .

    container_name: chatdevelop_app

    ports:
      - "3000:3000"

    volumes:
      - .:/app

    depends_on:
      - postgres
      - redis

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chatdevelop
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: chatdevelop_secret

    command: sh -c "npm install && npx prisma generate && npm run start:dev"

  postgres:
    image: postgres:17-alpine

    container_name: chatdevelop_postgres

    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatdevelop

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: chatdevelop_redis

    restart: unless-stopped

    ports:
      - "6379:6379"

volumes:
  postgres_data: